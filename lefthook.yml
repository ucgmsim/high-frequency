# lefthook.yml
#
# A local mirror of .github/workflows/ci.yml, so a formatting slip is caught
# before the shared meta-ci-action workflow reports it.
#
#   uvx lefthook install
#
# Autofixes run on pre-commit against the staged files; the gates run on
# pre-push against {push_files}, what this branch adds over the upstream ref.

# Autofix, on what is about to be committed. Kept to commands that finish in
# well under a second; the slower checks are on pre-push.
pre-commit:
  parallel: true
  commands:
    ruff:
      # uvx rather than uv run: independent of the project environment.
      run: uvx ruff check --fix {staged_files}
      glob: "*.py"
      # Stage the fixes ruff applies (e.g. removing unused imports).
      stage_fixed: true

    ruff-format:
      run: uvx ruff format {staged_files}
      glob: "*.py"
      stage_fixed: true

    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

# The CI gate, on everything the push is about to add. One command per job in
# the shared workflow.
pre-push:
  parallel: true
  commands:
    ruff:
      run: uvx ruff check {push_files}
      glob: "*.py"

    ruff-format:
      run: uvx ruff format --check {push_files}
      glob: "*.py"

    ty:
      # uv run so ty sees the project's installed packages. The whole project
      # rather than {push_files}: ty checks explicitly named files even when
      # [tool.ty.src] excludes them, which would pull in harness/.
      run: uv run ty check
      glob: "*.py"

    npdlint:
      # The one check with no autofix: docstring sections are written by hand.
      # Scope and exclusions come from [tool.npdlint] in pyproject.toml.
      run: uv run npdlint check {push_files}
      glob: "hf_simulation/**.py"

    yaml:
      run: uvx yamllint {push_files}
      glob: "*.{yaml,yml}"

    clippy:
      # Whole workspace rather than per file, which is what clippy takes.
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings

    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
