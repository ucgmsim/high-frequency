[workspace]
members = ["crates/hb_high", "crates/im", "crates/validate"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

# Debug and release must still agree with EACH OTHER, even though neither is
# bit-identical to the Fortran any more. That self-consistency is what catches a
# dependence on optimisation-level float behaviour, which has already found one real
# bug (PORTING_RULES.md §4b), so nothing here may enable fast-math or float
# reassociation. `-ffast-math` has no per-crate Rust equivalent and is not wanted.
#
# Two Stage 2 build-profile experiments, both MEASURED AND REJECTED. Timing on this
# machine drifts 1-3% between runs, which is the same size as the effects, so these were
# settled on instructions retired (reproducible to 1 part in 10^7) rather than wall
# clock:
#
#   lto = "fat" + codegen-units = 1   1.2% SLOWER on the medium fault and 29 s per
#                                     rebuild. Plausibly because rustfft's AVX kernels
#                                     are hand-tuned and cross-crate inlining disturbs
#                                     their register allocation.
#   overflow-checks = false           1.87% MORE instructions retired. Genuinely
#                                     counterintuitive; removing the checks perturbs
#                                     codegen elsewhere by more than it saves.
#
# So overflow-checks stays on in release, now for a measured reason rather than for
# symmetry with the old bit-identity contract. Do not re-try either without
# re-measuring.
[profile.release]
debug = true
overflow-checks = true

[profile.dev]
overflow-checks = true
