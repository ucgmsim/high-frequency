[workspace]
members = ["crates/hb_high", "crates/im", "crates/validate"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

# Bit-identity contract: the port must produce byte-identical output in debug and
# release. Anything that lets the optimiser reassociate float arithmetic breaks
# that, so both profiles stay on the same strict settings.
[profile.release]
debug = true
overflow-checks = true

[profile.dev]
overflow-checks = true
