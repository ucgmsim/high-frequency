[workspace]
members = ["crates/hb_high", "src-rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

# Lints are `warn` locally so an in-progress numerics change is not blocked; CI runs
# clippy with `-D warnings`. Silence an individual lint with a targeted `#[allow]` and
# the reason beside it, never a crate-root `#![allow]`.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

# Debug and release builds must produce the same results; a disagreement means the code
# depends on optimisation-level float behaviour (e.g. LLVM folds `powf(x, 0.5)` into
# `sqrt(x)` at -O2 but not at -O0). Nothing here may enable fast-math or float
# reassociation.
#
# Profile choices, measured on hardware counters (instructions and cycles) because
# wall-clock noise is as large as the effects:
#
#   overflow-checks = true    turning them off retired ~1.9% MORE instructions.
#   codegen-units = 1         ~7% fewer cycles than the default of 16.
#   lto                       off: removes more instructions than codegen-units = 1 alone
#                             but lowers IPC (it disturbs rustfft's hand-tuned SIMD
#                             kernels), so it is slower in cycles. Check both counters
#                             when re-testing.
[profile.release]
debug = true
overflow-checks = true
codegen-units = 1

[profile.dev]
overflow-checks = true
