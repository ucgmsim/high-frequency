name: Cargo

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # Both profiles: a disagreement between debug and release means the code depends on
      # optimisation-level float behaviour (e.g. LLVM folds `powf(x, 0.5)` into `sqrt(x)`
      # at -O2 but not at -O0).
      - name: Test (debug)
        run: cargo test --workspace --locked

      - name: Test (release)
        run: cargo test --workspace --locked --release

      # `-D warnings` here, `warn` in [workspace.lints]: a lint should not block local
      # work, but must block a pull request.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Format
        run: cargo fmt --all --check
