name: Pytest Check

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      # Every test builds the pyo3 extension first; installing Rust explicitly avoids
      # depending on the runner image's preinstalled toolchain.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Define a cache dependency glob
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: |
          uv run --extra test pytest --doctest-modules --cov=hf_simulation --cov-report=html tests hf_simulation

      - name: Combine coverage and fail it it’s under 100 %
        run: |
          uv run --extra test python -m coverage html --skip-covered --skip-empty

          # Report and write to summary.
          uv run --extra test python -m coverage report | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY

          # Report again and fail if under 95%.
          uv run --extra test python -Im coverage report --fail-under=95

      - name: Upload HTML report if check failed
        uses: actions/upload-artifact@v4

        with:
          name: html-report
          path: htmlcov

        if: ${{ failure() }}
