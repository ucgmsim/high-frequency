name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    uses: ucgmsim/meta-ci-action/.github/workflows/ci.yml@v2
    with:
      # Docstring scope and exclusions come from [tool.npdlint] in pyproject.toml.
      exclude-init: false
      # Test paths and --doctest-modules come from [tool.pytest.ini_options].
      pytest-paths: ""
      enable-coverage: true
      cov-package: hf_simulation
      cov-fail-under: 95
      # Debug and release must agree, because LLVM folds `powf(x, 0.5)` into
      # `sqrt(x)` at -O2 but not at -O0, so test the release profile too.
      rust-test-release: true
