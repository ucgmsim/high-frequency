[package]
name = "im"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Intensity measures for scientific equivalence testing of hb_high outputs"

# hb_high is used only for its bit-identity-gated FFT, so FAS does not need a new
# transform implementation or an external FFT crate.
[dependencies]
hb_high = { path = "../hb_high" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
