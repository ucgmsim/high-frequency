[package]
name = "hb_high"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port of EMOD3D hb_high_v6.0.3 (BINMOD/VERSION1) stochastic high-frequency seismogram generator"

[dependencies]
geographiclib-rs = "0.2.7"
# The PRNG; seeding uses `rand`'s SplitMix64 expansion.
rand_core = "0.10"
rand_pcg = "0.10"
# `RngExt::sample`, which is how a distribution is drawn from an engine.
rand = "0.10.2"
# Ziggurat normal sampling (see `rng::Pcg`).
rand_distr = "0.6.0"
libm = "0.2"
rustfft = "6.4.1"
bon = "3.9.3"
thiserror = "2.0.19"
ndarray = "0.17.2"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11"
# The gamma property tests call `libm::tgamma` directly.
libm = "0.2"

[lib]
name = "hb_high"
path = "src/lib.rs"

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "whole"
harness = false

# Not criterion: one iteration is minutes on the real deck, so there is nothing for a
# sampling harness to sample. It prints one line per station and exits.
[[bench]]
name = "alpine"
harness = false

[lints]
workspace = true
